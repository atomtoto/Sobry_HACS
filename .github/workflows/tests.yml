name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the planner tests
        run: python -m unittest discover -s tests -v
